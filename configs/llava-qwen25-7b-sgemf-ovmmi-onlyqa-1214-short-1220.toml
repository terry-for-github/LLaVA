# deepspeed
deepspeed = "scripts/zero2.json"

# model
model_name_or_path = "Qwen/Qwen2.5-7B-Instruct"
vision_tower = "openai/clip-vit-large-patch14-336"
pretrain_mm_mlp_adapter = "ckpts/llava-qwen25-7b-pretrain-sgemf-1214/mm_projector.bin"
mm_projector_type = "mlp2x_gelu"
mm_vision_select_layer = -2
model_max_length = 2048

# data process
version = "qwen"
data_path_list = [
    "playground/onevision",
    "playground/MMInstruct-GPT4V/jsons_all/qa_en_clean.json"
]
mm_use_im_start_end = false
mm_use_im_patch_token = false
image_aspect_ratio = "pad"
group_by_modality_length = false
lazy_preprocess = true

# training
bf16 = true
tf32 = true
num_train_epochs = 1
per_device_train_batch_size = 2
gradient_accumulation_steps = 4
learning_rate = 2e-5
weight_decay = 0.0
warmup_ratio = 0.03
lr_scheduler_type = "cosine"
max_grad_norm = 0.5
gradient_checkpointing = true
dataloader_num_workers = 4

# output
output_dir = "ckpts/llava-qwen25-7b-sgemf-ovmmi-onlyqa-1214-short-1220"
save_strategy = "steps"
save_steps = 4000
save_total_limit = 1
logging_steps = 1
